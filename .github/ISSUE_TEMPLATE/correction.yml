name: Data correction
description: Report a wrong count, name, missable, or trap.
title: "Correction: "
labels: [data]
body:
  - type: input
    id: item
    attributes:
      label: What is wrong?
      description: The requirement, card set, missable, or trap, as named on the site.
    validations:
      required: true
  - type: input
    id: current
    attributes:
      label: What the site says
    validations:
      required: true
  - type: input
    id: correct
    attributes:
      label: What it should say
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Sources
      description: "At least one source link. A screenshot or video timestamp from your own game is best; public guides work too."
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform (if from your own game)
      options: [PS5, Xbox Series X|S, Not from my game]
  - type: checkboxes
    id: spoilers
    attributes:
      label: Spoilers
      options:
        - label: My report contains no plot spoilers (chapters and locations are fine).
          required: true
